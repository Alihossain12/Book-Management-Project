<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Book Management with View/Edit/Delete and Image Upload</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <style>
    body { background: #f7f7f7; }
    .book-image { width: 80px; height: auto; object-fit: cover; border-radius: 4px; }
    #imagePreview { max-width: 150px; margin-top: 10px; border-radius: 4px; }
    .flash { margin-top: 10px; }
  </style>
</head>
<body>
<div class="container py-4">
  <h2 class="text-center mb-4">📚 Book Management</h2>

  <div class="d-flex justify-content-between mb-3">
    <div>
      <select id="categoryFilter" class="form-select">
        <option value="all">All Categories</option>
      </select>
    </div>
    <div>
      <button class="btn btn-primary" onclick="showCreateForm()">+ Add Book</button>
      <button class="btn btn-secondary" onclick="toggleTrash()">Trash</button>
      <button class="btn btn-outline-info" onclick="showCategoryModal()">Manage Categories</button>
    </div>
  </div>

  <div id="flashMessage" class="flash"></div>

  <!-- Book Table -->
  <div id="bookSection">
    <table class="table table-bordered bg-white">
      <thead class="table-light">
        <tr>
          <th>#</th><th>Image</th><th>Title</th><th>Author</th><th>Category</th><th>Actions</th>
        </tr>
      </thead>
      <tbody id="bookTableBody"></tbody>
    </table>
  </div>

  <!-- Create/Edit Book Form -->
  <div id="bookFormSection" style="display:none">
    <h4 id="formTitle">Add New Book</h4>
    <form id="bookForm" onsubmit="saveBook(event)" enctype="multipart/form-data" novalidate>
      <input type="hidden" id="bookId" />
      <div class="mb-2">
        <label for="title" class="form-label">Title</label>
        <input type="text" class="form-control" id="title" required />
      </div>
      <div class="mb-2">
        <label for="author" class="form-label">Author</label>
        <input type="text" class="form-control" id="author" required />
      </div>
      <div class="mb-2">
        <label for="category" class="form-label">Category</label>
        <select id="category" class="form-select" required></select>
      </div>
      <div class="mb-2">
        <label for="imageFile" class="form-label">Book Image</label>
        <input type="file" class="form-control" id="imageFile" accept="image/*" />
        <img id="imagePreview" src="" alt="Image Preview" style="display:none" />
      </div>
      <button type="submit" class="btn btn-success">Save</button>
      <button type="button" class="btn btn-secondary" onclick="cancelForm()">Cancel</button>
    </form>
  </div>

  <!-- Trash Section -->
  <div id="trashSection" style="display:none">
    <h4 class="mt-4">🗑️ Trash</h4>
    <table class="table table-bordered bg-white">
      <thead class="table-light">
        <tr>
          <th>#</th><th>Image</th><th>Title</th><th>Author</th><th>Category</th><th>Actions</th>
        </tr>
      </thead>
      <tbody id="trashTableBody"></tbody>
    </table>
  </div>
</div>

<!-- Category Modal -->
<div class="modal fade" id="categoryModal" tabindex="-1" aria-labelledby="categoryModalLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="categoryModalLabel">Manage Categories</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <form id="categoryForm" class="d-flex gap-2 mb-3" onsubmit="addCategory(event)">
          <input type="text" id="newCategory" class="form-control" placeholder="New category" required />
          <button class="btn btn-success">Add</button>
        </form>
        <ul class="list-group" id="categoryList"></ul>
      </div>
    </div>
  </div>
</div>

<!-- View Modal -->
<div class="modal fade" id="viewModal" tabindex="-1" aria-labelledby="viewModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered modal-lg">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="viewModalLabel">Book Details</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body d-flex flex-column flex-md-row gap-3">
        <img id="viewImage" src="" alt="Book Image" style="max-width:200px; border-radius:8px; object-fit:cover;" />
        <div>
          <h4 id="viewTitle"></h4>
          <p><strong>Author:</strong> <span id="viewAuthor"></span></p>
          <p><strong>Category:</strong> <span id="viewCategory"></span></p>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
      </div>
    </div>
  </div>
</div>

<script>
  let books = JSON.parse(localStorage.getItem('books')) || [];
  let categories = JSON.parse(localStorage.getItem('categories')) || ['Fiction', 'Non-Fiction', 'Science', 'Biography'];

  const categoryFilter = document.getElementById('categoryFilter');
  const categorySelect = document.getElementById('category');
  const categoryList = document.getElementById('categoryList');
  const bookTableBody = document.getElementById('bookTableBody');
  const trashTableBody = document.getElementById('trashTableBody');
  const flashDiv = document.getElementById('flashMessage');
  const imageFileInput = document.getElementById('imageFile');
  const imagePreview = document.getElementById('imagePreview');

  function init() {
    renderCategoryOptions();
    displayBooks();
    displayTrash();
  }

  function renderCategoryOptions() {
    categoryFilter.innerHTML = '<option value="all">All Categories</option>';
    categorySelect.innerHTML = '';
    categories.forEach(cat => {
      categoryFilter.innerHTML += `<option value="${cat}">${cat}</option>`;
      categorySelect.innerHTML += `<option value="${cat}">${cat}</option>`;
    });
  }

  function showCategoryModal() {
    categoryList.innerHTML = '';
    categories.forEach((cat, index) => {
      categoryList.innerHTML += `<li class="list-group-item d-flex justify-content-between align-items-center">
        ${cat}
        <button class="btn btn-sm btn-danger" onclick="deleteCategory(${index})">Delete</button>
      </li>`;
    });
    new bootstrap.Modal(document.getElementById('categoryModal')).show();
  }

  function addCategory(e) {
    e.preventDefault();
    const newCat = document.getElementById('newCategory').value.trim();
    if (newCat && !categories.includes(newCat)) {
      categories.push(newCat);
      localStorage.setItem('categories', JSON.stringify(categories));
      renderCategoryOptions();
      showFlash('Category added.');
      document.getElementById('newCategory').value = '';
      showCategoryModal();
    }
  }

  function deleteCategory(index) {
    if (confirm('Are you sure you want to delete this category?')) {
      categories.splice(index, 1);
      localStorage.setItem('categories', JSON.stringify(categories));
      renderCategoryOptions();
      showFlash('Category deleted.');
      showCategoryModal();
    }
  }

  function displayBooks() {
    const selected = categoryFilter.value;
    bookTableBody.innerHTML = '';
    books.filter(b => !b.deleted && (selected === 'all' || b.category === selected))
      .forEach((b, i) => {
        bookTableBody.innerHTML += `<tr>
          <td>${i + 1}</td>
          <td><img src="${b.image || 'https://via.placeholder.com/80'}" class="book-image" alt="Book Image" /></td>
          <td>${b.title}</td><td>${b.author}</td><td>${b.category}</td>
          <td>
            <button class="btn btn-sm btn-primary" onclick="viewBook(${b.id})">View</button>
            <button class="btn btn-sm btn-info" onclick="editBook(${b.id})">Edit</button>
            <button class="btn btn-sm btn-danger" onclick="deleteBook(${b.id})">Delete</button>
          </td>
        </tr>`;
      });
  }

  function displayTrash() {
    trashTableBody.innerHTML = '';
    books.filter(b => b.deleted).forEach((b, i) => {
      trashTableBody.innerHTML += `<tr>
        <td>${i + 1}</td>
        <td><img src="${b.image || 'https://via.placeholder.com/80'}" class="book-image" alt="Book Image" /></td>
        <td>${b.title}</td><td>${b.author}</td><td>${b.category}</td>
        <td>
          <button class="btn btn-sm btn-success" onclick="restoreBook(${b.id})">Restore</button>
          <button class="btn btn-sm btn-danger" onclick="permanentlyDeleteBook(${b.id})">Delete Permanently</button>
        </td>
      </tr>`;
    });
  }

  function saveBook(e) {
    e.preventDefault();

    const id = document.getElementById('bookId').value;
    const title = document.getElementById('title').value.trim();
    const author = document.getElementById('author').value.trim();
    const category = document.getElementById('category').value;

    if (!title || !author || !category) {
      showFlash('Please fill all required fields.');
      return;
    }

    if (imageFileInput.files && imageFileInput.files[0]) {
      const file = imageFileInput.files[0];
      const reader = new FileReader();
      reader.onload = function (event) {
        saveBookData(id, title, author, category, event.target.result);
      };
      reader.readAsDataURL(file);
    } else {
      let oldImage = '';
      if (id) {
        const book = books.find(b => b.id === Number(id));
        oldImage = book ? book.image : '';
      }
      saveBookData(id, title, author, category, oldImage);
    }
  }

  function saveBookData(id, title, author, category, image) {
    const newBook = {
      id: id ? Number(id) : Date.now(),
      title,
      author,
      category,
      image,
      deleted: false
    };

    if (id) {
      books = books.map(b => b.id === Number(id) ? newBook : b);
      showFlash('Book updated.');
    } else {
      books.push(newBook);
      showFlash('Book added.');
    }

    localStorage.setItem('books', JSON.stringify(books));
    cancelForm();
    displayBooks();
    displayTrash();
  }

  function deleteBook(id) {
    books = books.map(b => b.id === id ? {...b, deleted: true} : b);
    localStorage.setItem('books', JSON.stringify(books));
    showFlash('Book moved to trash.');
    displayBooks();
    displayTrash();
  }

  function editBook(id) {
    const book = books.find(b => b.id === id);
    if (!book) return;
    document.getElementById('bookId').value = book.id;
    document.getElementById('title').value = book.title;
    document.getElementById('author').value = book.author;
    document.getElementById('category').value = book.category;
    imageFileInput.value = '';
    if (book.image) {
      imagePreview.src = book.image;
      imagePreview.style.display = 'block';
    } else {
      imagePreview.style.display = 'none';
    }
    document.getElementById('formTitle').innerText = 'Edit Book';
    document.getElementById('bookFormSection').style.display = 'block';
    document.getElementById('bookSection').style.display = 'none';
    document.getElementById('trashSection').style.display = 'none';
  }

  function viewBook(id) {
    const book = books.find(b => b.id === id);
    if (!book) return;
    document.getElementById('viewImage').src = book.image || 'https://via.placeholder.com/200';
    document.getElementById('viewTitle').innerText = book.title;
    document.getElementById('viewAuthor').innerText = book.author;
    document.getElementById('viewCategory').innerText = book.category;
    const viewModal = new bootstrap.Modal(document.getElementById('viewModal'));
    viewModal.show();
  }

  function restoreBook(id) {
    books = books.map(b => b.id === id ? {...b, deleted: false} : b);
    localStorage.setItem('books', JSON.stringify(books));
    showFlash('Book restored.');
    displayBooks();
    displayTrash();
  }

  function permanentlyDeleteBook(id) {
    if (confirm('Are you sure you want to delete permanently? This cannot be undone.')) {
      books = books.filter(b => b.id !== id);
      localStorage.setItem('books', JSON.stringify(books));
      showFlash('Book deleted permanently.');
      displayTrash();
    }
  }

  function showCreateForm() {
    document.getElementById('bookId').value = '';
    document.getElementById('title').value = '';
    document.getElementById('author').value = '';
    document.getElementById('category').value = categories.length ? categories[0] : '';
    imageFileInput.value = '';
    imagePreview.style.display = 'none';
    document.getElementById('formTitle').innerText = 'Add New Book';
    document.getElementById('bookFormSection').style.display = 'block';
    document.getElementById('bookSection').style.display = 'none';
    document.getElementById('trashSection').style.display = 'none';
  }

  function cancelForm() {
    document.getElementById('bookFormSection').style.display = 'none';
    document.getElementById('bookSection').style.display = 'block';
    document.getElementById('trashSection').style.display = 'none';
    clearFlash();
  }

  function toggleTrash() {
    const trashSection = document.getElementById('trashSection');
    if (trashSection.style.display === 'none') {
      trashSection.style.display = 'block';
      document.getElementById('bookSection').style.display = 'none';
      document.getElementById('bookFormSection').style.display = 'none';
    } else {
      trashSection.style.display = 'none';
      document.getElementById('bookSection').style.display = 'block';
    }
    clearFlash();
  }

  function showFlash(msg) {
    flashDiv.innerHTML = `<div class="alert alert-success">${msg}</div>`;
    setTimeout(() => {
      flashDiv.innerHTML = '';
    }, 3000);
  }
  function clearFlash() {
    flashDiv.innerHTML = '';
  }

  imageFileInput.addEventListener('change', function () {
    if (this.files && this.files[0]) {
      const reader = new FileReader();
      reader.onload = function (e) {
        imagePreview.src = e.target.result;
        imagePreview.style.display = 'block';
      };
      reader.readAsDataURL(this.files[0]);
    } else {
      imagePreview.style.display = 'none';
      imagePreview.src = '';
    }
  });

  categoryFilter.addEventListener('change', displayBooks);
  init();
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
